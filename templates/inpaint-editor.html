<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuwanie obiektów AI - Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 16px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .main {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        
        .editor {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #333;
        }
        
        canvas {
            display: block;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: crosshair;
            width: 100%;
            max-width: 100%;
        }
        
        .controls {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #333;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .control-group {
            margin-bottom: 16px;
        }
        
        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }
        
        .radio-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        input[type="radio"] {
            margin-right: 4px;
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
        }
        
        input[type="range"] {
            width: 100%;
        }
        
        .range-value {
            display: inline-block;
            background: #0078d4;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #106ebe;
        }
        
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        button.secondary {
            background: #333;
        }
        
        button.secondary:hover {
            background: #444;
        }
        
        button.danger {
            background: #d13438;
        }
        
        button.danger:hover {
            background: #c50e2c;
        }
        
        .status {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            word-break: break-word;
        }
        
        .status.error {
            color: #d13438;
        }
        
        .status.success {
            color: #107c10;
        }
        
        .color-indicator {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .color-red {
            background: #ff0000;
        }
        
        .color-green {
            background: #00ff00;
        }
        
        .divider {
            height: 1px;
            background: #333;
            margin: 12px 0;
        }
        
        .select-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Usuwanie obiektów AI - Editor</h1>
            <p style="font-size: 13px; color: #888; margin-top: 4px;" id="sessionInfo"></p>
        </header>
        
        <div class="main">
            <div class="editor">
                <canvas id="canvas"></canvas>
                <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="secondary" onclick="zoomIn()">🔍+ Powiększ</button>
                    <button class="secondary" onclick="zoomOut()">🔍- Pomniejsz</button>
                    <button class="danger" onclick="undoMask()">↶ Cofnij</button>
                    <button class="danger" onclick="clearMasks()">🗑️ Wyczyść</button>
                </div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Tryb zaznaczania</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="red" checked onchange="setMode('red')">
                            <span class="color-indicator color-red"></span>Usuń
                        </label>
                    </div>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="green" onchange="setMode('green')">
                            <span class="color-indicator color-green"></span>Chroń
                        </label>
                    </div>
                </div>
                
                <div class="divider"></div>
                
                <div class="control-group">
                    <label>Grubość pędzla</label>
                    <input type="range" id="brushSize" min="5" max="80" value="20" 
                           oninput="updateBrushSize(this.value)">
                    <div style="font-size: 12px; color: #888; margin-top: 4px;">
                        Rozmiar: <span id="brushSizeValue">20</span>px
                    </div>
                </div>
                
                <div class="control-group">
                    <label>Skalowanie obrazu</label>
                    <input type="range" id="imageScale" min="20" max="150" value="100" 
                           oninput="updateImageScale(this.value)">
                    <div style="font-size: 12px; color: #888; margin-top: 4px;">
                        Skala: <span id="imageScaleValue">100</span>%
                    </div>
                </div>
                
                <div class="control-group">
                    <label>Rozszerzenie maski</label>
                    <input type="range" id="dilation" min="0" max="40" value="12"
                           oninput="document.getElementById('dilationValue').textContent = this.value">
                    <div style="font-size: 12px; color: #888; margin-top: 4px;">
                        <span id="dilationValue">12</span>px
                    </div>
                </div>
                
                <div class="divider"></div>
                
                <div class="control-group">
                    <label>AI Segmentacja (SAM)</label>
                    <button onclick="toggleSAMMode()" style="background: #ffa500;">
                        🤖 Kliknij na obiekt (SAM)
                    </button>
                    <div style="font-size: 11px; color: #888; margin-top: 6px;">
                        Kliknij na obiekt aby użyć MobileSAM do automatycznego zaznaczenia
                    </div>
                </div>
                
                <div class="divider"></div>
                
                <div class="control-group">
                    <label>Model inpaintingu</label>
                    <select id="inpaintModel">
                        <option value="lama">big-LaMa (szybki)</option>
                        <option value="mat">MAT (precyzyjny)</option>
                    </select>
                </div>
                
                <div class="divider"></div>
                
                <div class="control-group">
                    <button onclick="runInpainting()" style="background: #107c10;">
                        ✨ Uruchom inpainting
                    </button>
                    <div class="status" id="status"></div>
                </div>
                
                <button class="secondary" onclick="downloadResult()">⬇️ Pobierz wynik</button>
                <button class="secondary" onclick="closeEditor()">← Wróć</button>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let sessionId = new URLSearchParams(window.location.search).get('session_id');
        if (!sessionId) {
            alert('Brak session_id! Powrót do głównej strony.');
            window.location.href = '/';
        }
        
        document.getElementById('sessionInfo').textContent = `Sesja: ${sessionId}`;
        
        let currentMode = 'red';
        let brushSize = 20;
        let isDrawing = false;
        let zoom = 1.0;
        let originalImage = null;
        let isProcessing = false;
        let samMode = false;  // Toggle for SAM click detection
        
        // Załaduj obrazek
        async function loadImage() {
            try {
                const res = await fetch(`/api/inpaint/preview?session_id=${sessionId}`);
                const blob = await res.blob();
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    resizeCanvas();
                    drawCanvas();
                };
                img.src = URL.createObjectURL(blob);
            } catch (e) {
                updateStatus('Błąd ładowania obrazu: ' + e.message, 'error');
            }
        }
        
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width - 32; // padding
            canvas.height = Math.max(600, originalImage.height / originalImage.width * canvas.width);
            drawCanvas();
        }
        
        function drawCanvas() {
            if (!originalImage) return;
            
            const w = canvas.width / zoom;
            const h = canvas.height / zoom;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(zoom, zoom);
            ctx.drawImage(originalImage, 0, 0, w, h);
            ctx.restore();
        }
        
        canvas.addEventListener('mousedown', (e) => {
            if (isProcessing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / zoom;
            const y = (e.clientY - rect.top) / zoom;
            
            // SAM mode: single click to predict
            if (samMode) {
                predictSAM(x, y);
                return;
            }
            
            // Normal drawing mode
            isDrawing = true;
            drawStroke(x, y);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || isProcessing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / zoom;
            const y = (e.clientY - rect.top) / zoom;
            drawStroke(x, y);
        });
        
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });
        
        function drawStroke(x, y) {
            ctx.fillStyle = currentMode === 'red' ? '#ff0000' : '#00ff00';
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(x, y, brushSize / zoom, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        
        function setMode(mode) {
            currentMode = mode;
            canvas.style.cursor = currentMode === 'red' ? 'crosshair' : 'cell';
        }
        
        function updateBrushSize(val) {
            brushSize = parseInt(val);
            document.getElementById('brushSizeValue').textContent = brushSize;
        }
        
        function updateImageScale(val) {
            const scale = parseInt(val) / 100;
            document.getElementById('imageScaleValue').textContent = val;
            const newWidth = Math.floor(originalImage.width * scale);
            const newHeight = Math.floor(originalImage.height * scale);
            canvas.width = newWidth;
            canvas.height = newHeight;
            drawCanvas();
        }
        
        function zoomIn() {
            zoom = Math.min(zoom + 0.2, 3);
            drawCanvas();
        }
        
        function zoomOut() {
            zoom = Math.max(zoom - 0.2, 1);
            drawCanvas();
        }
        
        function undoMask() {
            updateStatus('Cofnięcie nie zaimplementowane', 'error');
        }
        
        function clearMasks() {
            if (confirm('Na pewno wyczyścić maski?')) {
                drawCanvas();
                updateStatus('Maski wyczyszczone');
            }
        }
        
        function toggleSAMMode() {
            samMode = !samMode;
            if (samMode) {
                updateStatus('🤖 Tryb SAM aktywny - kliknij na obiekt', 'success');
                canvas.style.cursor = 'crosshair';
            } else {
                updateStatus('Tryb SAM wyłączony', '');
                canvas.style.cursor = 'crosshair';
            }
        }
        
        async function predictSAM(x, y) {
            if (!samMode || isProcessing) return;
            isProcessing = true;
            updateStatus('⏳ Analizuję obiekt z SAM...', '');
            
            try {
                const res = await fetch('/api/inpaint/sam-predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        points: [[x, y]],  // Single click point
                        mode: currentMode
                    })
                });
                
                const result = await res.json();
                if (result.error) {
                    updateStatus('❌ SAM error: ' + result.error, 'error');
                } else {
                    updateStatus('✅ Maska z SAM dodana!', 'success');
                    // Refresh preview
                    await refreshPreview();
                    samMode = false;  // Auto-disable SAM mode after prediction
                }
            } catch (e) {
                updateStatus('Błąd SAM: ' + e.message, 'error');
            } finally {
                isProcessing = false;
            }
        }
        
        async function refreshPreview() {
            try {
                const res = await fetch(`/api/inpaint/preview?session_id=${sessionId}`);
                const blob = await res.blob();
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    drawCanvas();
                };
                img.src = URL.createObjectURL(blob);
            } catch (e) {
                console.error('Preview refresh failed:', e);
            }
        }
        
        async function runInpainting() {
            if (isProcessing) return;
            isProcessing = true;
            updateStatus('⏳ Przetwarzanie...', '');
            
            try {
                // Prześlij maski
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                // TODO: wyciągnij red/green maski z canvas
                
                // Uruchom inpainting
                const res = await fetch('/api/inpaint/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        model: document.getElementById('inpaintModel').value,
                        dilation: parseInt(document.getElementById('dilation').value)
                    })
                });
                
                const result = await res.json();
                if (result.success) {
                    updateStatus('✅ Gotowe!', 'success');
                    // TODO: wyświetl wynik
                } else {
                    updateStatus('Błąd: ' + result.error, 'error');
                }
            } catch (e) {
                updateStatus('Błąd: ' + e.message, 'error');
            } finally {
                isProcessing = false;
            }
        }
        
        function downloadResult() {
            const link = document.createElement('a');
            link.href = `/api/inpaint/download?session_id=${sessionId}`;
            link.download = `inpaint-result-${sessionId}.png`;
            link.click();
        }
        
        function closeEditor() {
            if (confirm('Zamknąć editor?')) {
                window.location.href = '/';
            }
        }
        
        function updateStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
        }
        
        // Init
        loadImage();
        window.addEventListener('resize', () => resizeCanvas());
    </script>
</body>
</html>
