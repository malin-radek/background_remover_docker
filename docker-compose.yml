version: "3.8"
services:
  background-remover:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8585:5000"
    environment:
      - DEFAULT_MODEL=u2net
      - MAX_UPLOAD_MB=100
      - PORT=5000
      - U2NET_HOME=/app/models
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      # Persystentne modele między restartami kontenera
      - rembg_models:/app/models
      # Bind mounty — kopiujesz pliki na serwer i robisz restart, bez rebuild!
      - ./plugins:/app/plugins:ro
      - ./templates:/app/templates:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  rembg_models:
