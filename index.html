<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Remover</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:        #1a1a1a;
    --surface:   #2a2a2a;
    --border:    #444;
    --blue:      #0066cc;
    --green:     #00ff00;
    --green-dim: #00aa00;
    --red:       #cc0000;
    --yellow:    #ffff00;
    --orange:    #ffaa00;
    --text:      #cccccc;
    --muted:     #666666;
    --white:     #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  header {
    width: 100%;
    background: var(--blue);
    padding: 14px 0;
    text-align: center;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--white);
    letter-spacing: 1px;
  }

  /* ── Main container ── */
  main {
    width: 100%;
    max-width: 640px;
    padding: 20px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── Drop zone ── */
  #drop-zone {
    border: 2px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  #drop-zone:hover,
  #drop-zone.drag-over {
    border-color: var(--green);
    background: #333;
  }
  #drop-zone.drag-over { border-style: dashed; }

  #drop-zone .dz-icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }
  #drop-zone .dz-label {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--muted);
    line-height: 1.5;
    transition: color .15s;
  }
  #drop-zone:hover .dz-label,
  #drop-zone.drag-over .dz-label { color: var(--green); }

  /* ── Controls row ── */
  .controls {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-group label {
    font-size: .8rem;
    font-weight: 700;
    color: var(--text);
  }
  select {
    background: #333;
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--blue); }

  /* ── Queue label ── */
  .queue-label {
    font-size: .85rem;
    font-weight: 700;
    color: var(--green);
  }

  /* ── File list ── */
  #file-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-height: 120px;
    max-height: 260px;
    overflow-y: auto;
  }
  #file-list::-webkit-scrollbar { width: 6px; }
  #file-list::-webkit-scrollbar-track { background: var(--surface); }
  #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    font-size: .78rem;
    border-bottom: 1px solid #333;
    animation: fadeIn .2s ease;
  }
  .file-row:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

  .file-row .icon { font-size: 1rem; flex-shrink: 0; }
  .file-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--green); }
  .file-row .status { flex-shrink: 0; font-size: .72rem; color: var(--muted); }
  .file-row.done .name  { color: #aaa; }
  .file-row.error .name { color: var(--red); }

  /* ── Progress bar ── */
  .progress-wrap { display: flex; flex-direction: column; gap: 4px; }
  .progress-wrap span { font-size: .75rem; color: var(--text); }
  .progress-bar-bg {
    width: 100%;
    height: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--green-dim);
    width: 0%;
    transition: width .3s ease;
  }
  .progress-bar-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .72rem;
    font-weight: 700;
    color: var(--white);
  }

  /* ── Status ── */
  #status {
    font-size: .82rem;
    color: var(--yellow);
    min-height: 1.2em;
  }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 10px; }
  button {
    flex: 1;
    padding: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: filter .1s, transform .1s;
  }
  button:active { transform: scale(.98); filter: brightness(.85); }

  #btn-start  { background: var(--green-dim); color: var(--white); }
  #btn-clear  { background: var(--red);       color: var(--white); }
  #btn-start:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Preview strip ── */
  #preview-strip {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .preview-pair {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px;
    animation: fadeIn .3s ease;
  }
  .preview-thumb {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .preview-thumb span { font-size: .65rem; color: var(--muted); }
  .preview-thumb img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    border-radius: 3px;
    background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 0 0 / 12px 12px;
  }

  /* ── Download buttons ── */
  .download-buttons {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .btn-download {
    padding: 4px 8px;
    font-size: .7rem;
    background: var(--blue);
    color: var(--white);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
    transition: filter .1s, background .1s;
    font-weight: 600;
  }
  .btn-download:hover { filter: brightness(1.2); }
  .btn-download:active { transform: scale(.95); }
  .btn-download:disabled { opacity: .5; cursor: not-allowed; }
  .btn-download.mp4 { background: var(--orange); }

  #hidden-input { display: none; }
</style>
</head>
<body>

<header>
  <h1>🖼️ Background Remover</h1>
</header>

<main>

  <!-- Drop zone -->
  <div id="drop-zone">
    <span class="dz-icon">📂</span>
    <span class="dz-label">PRZECIĄGNIJ ZDJĘCIA TUTAJ<br>lub kliknij aby wybrać</span>
  </div>
  <input type="file" id="hidden-input" multiple accept=".jpg,.jpeg,.png,.bmp,.gif,.tiff,.webp">

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <label>Model:</label>
      <select id="sel-model">
        <option value="u2net">u2net (szybki, domyślny)</option>
        <option value="birefnet-general">birefnet-general (najlepsza jakość)</option>
        <option value="isnet-general-use">isnet-general-use (wysoka jakość)</option>
        <option value="u2net_human_seg">u2net_human_seg (ludzie)</option>
        <option value="silueta">silueta (sylwetki)</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Skala:</label>
      <select id="sel-scale">
        <option value="100">100%</option>
        <option value="90">90%</option>
        <option value="80">80%</option>
        <option value="70">70%</option>
        <option value="60">60%</option>
        <option value="50">50%</option>
        <option value="40">40%</option>
        <option value="30">30%</option>
        <option value="20">20%</option>
      </select>
    </div>
  </div>

  <!-- File queue label -->
  <div class="queue-label">Wybrane zdjęcia:</div>

  <!-- File list -->
  <div id="file-list"></div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
      <div class="progress-bar-text" id="progress-text"></div>
    </div>
  </div>

  <!-- Status -->
  <div id="status">Gotowy</div>

  <!-- Buttons -->
  <div class="btn-row">
    <button id="btn-start" disabled>▶ START</button>
    <button id="btn-clear">🗑 WYCZYŚĆ</button>
  </div>

  <!-- Preview strip -->
  <div id="preview-strip"></div>

</main>

<script>
(() => {
  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('hidden-input');
  const fileList   = document.getElementById('file-list');
  const btnStart   = document.getElementById('btn-start');
  const btnClear   = document.getElementById('btn-clear');
  const statusEl   = document.getElementById('status');
  const fillEl     = document.getElementById('progress-fill');
  const textEl     = document.getElementById('progress-text');
  const previewStrip = document.getElementById('preview-strip');
  const selModel   = document.getElementById('sel-model');
  const selScale   = document.getElementById('sel-scale');

  const ALLOWED = new Set(['image/jpeg','image/png','image/bmp','image/gif','image/tiff','image/webp','image/tiff']);
  let queue = [];   // { file, rowEl, status: 'pending'|'processing'|'done'|'error' }
  let processing = false;

  // ── Drag & drop ──────────────────────────────────────────────────────────
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files]);
  });
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

  // ── Add files ─────────────────────────────────────────────────────────────
  function addFiles(files) {
    const valid = files.filter(f => ALLOWED.has(f.type) || /\.(jpe?g|png|bmp|gif|tiff?|webp)$/i.test(f.name));
    if (!valid.length) return;
    valid.forEach(f => {
      const item = { file: f, status: 'pending', rowEl: null };
      item.rowEl = createRow(item);
      queue.push(item);
      fileList.appendChild(item.rowEl);
    });
    btnStart.disabled = false;
    setStatus(`✅ ${queue.filter(i => i.status === 'pending').length} plik(ów) — naciśnij START`, 'yellow');
    updateProgress();
  }

  function createRow(item) {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <span class="icon">⏳</span>
      <span class="name">${item.file.name}</span>
      <span class="status"></span>`;
    return row;
  }

  function updateRow(item, icon, statusText, cls) {
    item.rowEl.querySelector('.icon').textContent = icon;
    item.rowEl.querySelector('.status').textContent = statusText;
    item.rowEl.className = 'file-row' + (cls ? ' ' + cls : '');
  }

  // ── Progress ──────────────────────────────────────────────────────────────
  function updateProgress() {
    const total = queue.length;
    const done  = queue.filter(i => i.status === 'done' || i.status === 'error').length;
    const pct   = total ? Math.round(done / total * 100) : 0;
    fillEl.style.width = pct + '%';
    textEl.textContent = total ? `${done}/${total} (${pct}%)` : '';
  }

  function setStatus(msg, color = 'yellow') {
    statusEl.textContent = msg;
    statusEl.style.color = {
      yellow: 'var(--yellow)', green: 'var(--green)',
      orange: 'var(--orange)', red: '#ff4444', muted: 'var(--muted)'
    }[color] || 'var(--yellow)';
  }

  // ── Process queue ─────────────────────────────────────────────────────────
  btnStart.addEventListener('click', async () => {
    if (processing) return;
    const pending = queue.filter(i => i.status === 'pending');
    if (!pending.length) return;

    processing = true;
    btnStart.disabled = true;
    setStatus('Przetwarzanie...', 'orange');

    for (const item of pending) {
      item.status = 'processing';
      updateRow(item, '⏳', 'przetwarzanie...', '');
      setStatus(`Przetwarzanie: ${item.file.name}`, 'orange');

      try {
        const result = await uploadFile(item.file);
        item.status = 'done';
        updateRow(item, '✅', `gotowe`, 'done');
        addPreview(item.file, result.blob, result.name);
        triggerDownload(result.blob, result.name);
      } catch (err) {
        item.status = 'error';
        updateRow(item, '❌', err.message?.slice(0, 40) || 'błąd', 'error');
      }

      updateProgress();
    }

    processing = false;
    const errors = queue.filter(i => i.status === 'error').length;
    if (errors) {
      setStatus(`✅ Gotowe — ${errors} błąd(ów)`, 'orange');
    } else {
      setStatus('✅ Gotowe!', 'green');
    }
  });

  // ── Upload ────────────────────────────────────────────────────────────────
  async function uploadFile(file) {
    const fd = new FormData();
    fd.append('image', file);
    fd.append('model',  selModel.value);
    fd.append('scale',  selScale.value);

    const resp = await fetch('/remove-background', { method: 'POST', body: fd });
    if (!resp.ok) {
      const json = await resp.json().catch(() => ({}));
      throw new Error(json.error || `HTTP ${resp.status}`);
    }
    const blob = await resp.blob();
    const stem = file.name.replace(/\.[^.]+$/, '');
    const name = `${stem}_nobg.png`;
    return { blob, name };
  }

  // ── Auto-download ─────────────────────────────────────────────────────────
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // ── Preview ───────────────────────────────────────────────────────────────
  function addPreview(origFile, resultBlob, resultName) {
    const origUrl   = URL.createObjectURL(origFile);
    const resultUrl = URL.createObjectURL(resultBlob);
    const isGif = resultBlob.type === 'image/gif';

    const pair = document.createElement('div');
    pair.className = 'preview-pair';
    
    let resultHtml = `
      <div class="preview-thumb">
        <img src="${origUrl}" alt="oryginał">
        <span>oryginał</span>
      </div>
      <div class="preview-thumb">
        <img src="${resultUrl}" alt="bez tła">
        <span>bez tła</span>
        <div class="download-buttons">`;
    
    // Przycisk pobierz GIF (zawsze)
    resultHtml += `<button class="btn-download" onclick="downloadFile('${resultUrl}', '${resultName}')">📥 GIF</button>`;
    
    // Przycisk MP4 (tylko dla GIF)
    if (isGif) {
      resultHtml += `<button class="btn-download mp4" onclick="convertToMP4('${resultName}', event)">📹 MP4</button>`;
    }
    
    resultHtml += `</div></div>`;
    
    pair.innerHTML = resultHtml;
    previewStrip.prepend(pair);
  }
  
  // ── Download helper ───────────────────────────────────────────────────────
  function downloadFile(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  
  // ── Convert GIF to MP4 ─────────────────────────────────────────────────────
  async function convertToMP4(gifName, event) {
    event.target.disabled = true;
    event.target.textContent = '⏳ Konwersja...';
    
    try {
      // Pobierz GIF z displayu
      const gifUrl = event.target.parentElement.parentElement.querySelector('img').src;
      const gifBlob = await fetch(gifUrl).then(r => r.blob());
      
      // Wyślij do backend
      const fd = new FormData();
      fd.append('gif', gifBlob, gifName.replace('.gif', '') + '.gif');
      
      const resp = await fetch('/gif-to-mp4', { method: 'POST', body: fd });
      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status}`);
      }
      
      const mp4Blob = await resp.blob();
      const mp4Name = gifName.replace(/\.gif$/i, '.mp4');
      downloadFile(URL.createObjectURL(mp4Blob), mp4Name);
      
    } catch (err) {
      alert(`❌ Konwersja MP4 nie powiodła się: ${err.message}`);
    } finally {
      event.target.disabled = false;
      event.target.textContent = '📹 MP4';
    }
  }

  // ── Clear ─────────────────────────────────────────────────────────────────
  btnClear.addEventListener('click', () => {
    if (processing) return;
    queue = [];
    fileList.innerHTML = '';
    previewStrip.innerHTML = '';
    fillEl.style.width = '0%';
    textEl.textContent = '';
    btnStart.disabled = true;
    setStatus('Gotowy');
  });

})();
</script>
</body>
</html>
