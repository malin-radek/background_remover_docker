version: "3.8"
services:
  removeBackground:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: removeBackground
    hostname: removeBackground
    ports:
      - "5000:5000"
    environment:
      - DEFAULT_MODEL=u2net
      - MAX_UPLOAD_MB=100
      - PORT=5000
      - U2NET_HOME=/app/models
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - rembg_models:/app/models
      - ./plugins:/app/plugins:ro
      - ./templates:/app/templates:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default

volumes:
  rembg_models:
    driver: local

networks:
  default:
    driver: bridge
